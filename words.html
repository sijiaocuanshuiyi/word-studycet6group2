const container = document.getElementById("container");
let voiceList = [];

// 等待语音加载
function loadVoices(){
    voiceList = window.speechSynthesis.getVoices();
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

//语音朗读函数
function speakWord(word){
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = "en-US";
    utter.rate = 0.95;
    //优先选用英文人声
    const enVoice = voiceList.find(v=>v.lang.startsWith('en'));
    if(enVoice) utter.voice = enVoice;
    window.speechSynthesis.speak(utter);
}
//渲染全部单词
wordList.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className = "word-item";
    div.innerHTML = `
    <span class="index-num">${idx+1}.</span>
    <span class="en-word" data-word="${item.en}">${item.en}</span>
    <span class="phonetic">${item.phonetic}</span>
    <div class="meaning">${item.cn}</div>
    `;
    //绑定点击朗读
    div.querySelector(".en-word").addEventListener('click',function(){
        speakWord(this.dataset.word);
    })
    container.appendChild(div);
})
